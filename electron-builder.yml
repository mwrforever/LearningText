# 打包配置（宪法 B.1 裁决：输出 release/；A.5-2：原生 .node 必须 asar unpack）
appId: com.mwrforever.learningtext
productName: LearningText
directories:
  output: release
  buildResources: build
files:
  - dist/main/**/*
  - dist/preload/**/*
  # shared 由 tsconfig.main（rootDir=src）编译进 dist/shared，dist/main 下产物 require ../shared/*，遗漏即打包产物启动崩溃
  - dist/shared/**/*
  - dist/renderer/**/*
  - package.json
asarUnpack:
  - '**/node_modules/better-sqlite3/**/*.node'
npmRebuild: true
# NSIS 向导式安装（M6 spec §5.3，FR 用户需求：安装位置由用户选择）：
# oneClick:false 是 allowToChangeInstallationDirectory 的前置条件（assisted installer only）
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: LearningText-Setup-${version}.${ext}
win:
  target: nsis
mac:
  target: dmg
linux:
  target: AppImage
